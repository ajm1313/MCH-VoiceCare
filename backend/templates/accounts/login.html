{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="mchvoicecare">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCH VoiceCare — Sign In</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200 p-4">
  <div class="w-full max-w-md fade-in">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="relative">
        <div class="absolute inset-0 rounded-3xl blur-2xl scale-125 bg-base-100/60"></div>
        <img src="{% static 'img/logo-light.png' %}" alt="MCH VoiceCare"
             class="relative w-24 h-24 rounded-2xl object-cover logo-light">
        <img src="{% static 'img/logo-dark.png' %}" alt="MCH VoiceCare"
             class="relative w-24 h-24 rounded-2xl object-cover logo-dark hidden">
      </div>
    </div>

    <!-- Card -->
    <div class="card bg-base-100 shadow-xl border border-base-300">
      <div class="card-body">

        <form method="post" class="space-y-4">
          {% csrf_token %}

          {% if form.errors %}
          <div class="alert alert-error">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
            <span class="text-sm">Invalid username or password.</span>
          </div>
          {% endif %}

          <div class="form-field">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username"
              class="input input-bordered w-full"
              autofocus placeholder="Enter your username"
              value="{{ form.username.value|default:'' }}">
          </div>

          <div class="form-field">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password"
              class="input input-bordered w-full"
              placeholder="Enter your password">
          </div>

          <button type="submit" class="btn btn-primary w-full">Sign In</button>
        </form>

      </div>
    </div>

    <p class="text-center text-xs text-base-content/40 mt-6">
      MCH VoiceCare &middot; Maternal &amp; Child Health Risk Decision Support System
    </p>
  </div>

  <script>
  (function() {
    function updateLogos() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.querySelectorAll('.logo-light').forEach(function(el) { el.classList.toggle('hidden', isDark); });
      document.querySelectorAll('.logo-dark').forEach(function(el) { el.classList.toggle('hidden', !isDark); });
    }
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e) {}
    updateLogos();
  })();
  </script>
</body>
</html>
