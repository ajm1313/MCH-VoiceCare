<!-- Top navbar -->
<header class="navbar bg-base-100 border-b border-base-300 px-6">
  <div class="flex-1">
    <h2 class="text-lg font-semibold">{% block navbar_title %}{% endblock %}</h2>
  </div>
  <div class="flex-none gap-2">
    <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm">
      <input type="checkbox" class="theme-controller" value="dark" id="theme-toggle" />
      <svg class="swap-on fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5.64 17.64A9 9 0 0 1 17.64 5.64 9 9 0 1 0 5.64 17.64Z"/></svg>
      <svg class="swap-off fill-current w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.592-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.757 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/></svg>
    </label>
  </div>
</header>
<script>
(function() {
  function updateLogos() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var lightLogos = document.querySelectorAll('.logo-light');
    var darkLogos = document.querySelectorAll('.logo-dark');
    lightLogos.forEach(function(el) { el.classList.toggle('hidden', isDark); });
    darkLogos.forEach(function(el) { el.classList.toggle('hidden', !isDark); });
  }
  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('change', function() {
      var isDark = this.checked;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'mchvoicecare');
      try { localStorage.setItem('theme', isDark ? 'dark' : 'mchvoicecare'); } catch(e) {}
      updateLogos();
    });
  }
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e) {}
  if (saved === 'dark') {
    if (toggle) toggle.checked = true;
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  updateLogos();
})();
</script>
