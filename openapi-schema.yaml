  /api/v1/accounts/role-scopes/:
    get:
      operationId: api_v1_accounts_role_scopes_list
      description: Read-only viewset for role scopes.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role_code
        schema:
          type: string
          enum:
          - DISTRICT_ADMIN
          - FACILITY_CLINICAL_USER
          - READ_ONLY
          - REGIONAL_ADMIN
          - SUBDISTRICT_ADMIN
          - SUPER_ADMIN
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `REGIONAL_ADMIN` - Regional Administrator
          * `DISTRICT_ADMIN` - District Administrator
          * `SUBDISTRICT_ADMIN` - Sub-district Administrator
          * `FACILITY_CLINICAL_USER` - Facility Clinical User
          * `READ_ONLY` - Read Only
      - in: query
        name: scope_unit
        schema:
          type: string
          format: uuid
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserRoleScopeList'
          description: ''
  /api/v1/accounts/role-scopes/{id}/:
    get:
      operationId: api_v1_accounts_role_scopes_retrieve
      description: Read-only viewset for role scopes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this user role scope.
        required: true
      tags:
