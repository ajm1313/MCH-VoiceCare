          $ref: '#/components/schemas/CWCSessionStatusEnum'
        expected_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        attended_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - facility_name
      - id
      - session_date
      - updated_at
    CWCSessionAttendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        child_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        attended:
          type: boolean
        doses_given: {}
        growth_recorded:
          type: boolean
        notes:
          type: string
        session:
          type: string
          format: uuid
        child:
