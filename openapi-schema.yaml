  /api/v1/clients/reconciliation-queue/:
    get:
      operationId: api_v1_clients_reconciliation_queue_list
      description: |-
        View and resolve patient identity reconciliation queue items (spec §19.4).

        GET    /api/v1/clients/reconciliation-queue/       — list pending items
        GET    /api/v1/clients/reconciliation-queue/{id}/   — retrieve a single item
        POST   /api/v1/clients/reconciliation-queue/{id}/resolve/ — resolve an item
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - RESOLVED_KEEP_BOTH
          - RESOLVED_MERGE
          - RESOLVED_REJECT
        description: |-
          * `PENDING` - Pending
          * `RESOLVED_MERGE` - Resolved - Merged
          * `RESOLVED_KEEP_BOTH` - Resolved - Keep Both
          * `RESOLVED_REJECT` - Resolved - Rejected
      tags:
      - clients
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientReconciliationQueueList'
          description: ''
