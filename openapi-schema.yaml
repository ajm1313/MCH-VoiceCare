components:
  schemas:
    ActionRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        action_type:
          type: string
          maxLength: 50
        notes:
          type: string
        recorded_by:
          type: string
          maxLength: 200
        notification:
          type: string
          format: uuid
      required:
      - action_type
      - created_at
      - id
      - notification
      - updated_at
    ActionRecordRequest:
      type: object
      properties:
        action_type:
          type: string
          minLength: 1
          maxLength: 50
        notes:
          type: string
        recorded_by:
          type: string
          maxLength: 200
        notification:
          type: string
          format: uuid
      required:
      - action_type
      - notification
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: string
          maxLength: 200
        actor_role:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 100
        entity_type:
          type: string
          maxLength: 50
        entity_id:
          type: string
          maxLength: 100
        patient_id:
          type: string
          format: uuid
          nullable: true
        pregnancy_episode_id:
          type: string
          format: uuid
          nullable: true
        referral_episode_id:
          type: string
          format: uuid
          nullable: true
        facility_id:
          type: string
          format: uuid
          nullable: true
        device_id:
          type: string
          maxLength: 100
        purpose:
          type: string
          maxLength: 50
        metadata: {}
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - occurred_at
      - updated_at
    BirthEpisode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mother_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        birth_datetime:
          type: string
          format: date-time
          nullable: true
        place_of_birth:
          type: string
          maxLength: 200
        skilled_attendant:
          type: boolean
        mode_of_delivery:
          type: string
          maxLength: 50
        maternal_fever_labour:
          type: boolean
        rupture_membranes_hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        liquor_quality:
          type: string
          maxLength: 30
        facility:
          type: string
          maxLength: 200
        birth_location:
          type: string
          maxLength: 100
        delivery_type:
          type: string
          maxLength: 50
        labour_duration_hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        complications:
          type: string
        mother:
          type: string
          format: uuid
        pregnancy:
          type: string
          format: uuid
          nullable: true
      required:
      - created_at
      - id
      - mother
      - mother_name
      - updated_at
    BirthEpisodeRequest:
      type: object
      properties:
        birth_datetime:
          type: string
          format: date-time
          nullable: true
        place_of_birth:
          type: string
          maxLength: 200
        skilled_attendant:
          type: boolean
        mode_of_delivery:
          type: string
          maxLength: 50
        maternal_fever_labour:
          type: boolean
        rupture_membranes_hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        liquor_quality:
          type: string
          maxLength: 30
        facility:
          type: string
          maxLength: 200
        birth_location:
          type: string
          maxLength: 100
        delivery_type:
          type: string
          maxLength: 50
        labour_duration_hours:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        complications:
          type: string
        mother:
          type: string
          format: uuid
        pregnancy:
          type: string
          format: uuid
          nullable: true
      required:
      - mother
    BlankEnum:
