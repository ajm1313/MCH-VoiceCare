      description: |-
        POST /api/v1/accounts/mfa/setup — generate TOTP secret (spec §22).

        Returns the secret and a QR code URI for authenticator apps.
        Recovery codes are also generated and returned once.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
