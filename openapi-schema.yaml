    get:
      operationId: api_v1_notifications_list
      description: Mixin that blocks write operations for READ_ONLY role users.
      parameters:
      - in: query
        name: notification_class
        schema:
          type: string
          enum:
          - APPOINTMENT
          - DEFAULTER
          - EMERGENCY
          - REFERRAL
          - SYSTEM
        description: |-
          * `EMERGENCY` - Emergency
          * `REFERRAL` - Referral
          * `APPOINTMENT` - Appointment
          * `DEFAULTER` - Defaulter
          * `SYSTEM` - System
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACKNOWLEDGED
          - ACTED
          - DISMISSED
          - OPEN
        description: |-
          * `OPEN` - Open
          * `ACKNOWLEDGED` - Acknowledged
          * `ACTED` - Acted Upon
          * `DISMISSED` - Dismissed
      - in: query
        name: urgency
        schema:
          type: string
          enum:
          - ABSTAIN
          - EMERGENCY
          - PRIORITY
          - ROUTINE
        description: |-
          * `EMERGENCY` - Emergency
          * `PRIORITY` - Priority Review
          * `ROUTINE` - Routine
          * `ABSTAIN` - Abstain — Insufficient Data
