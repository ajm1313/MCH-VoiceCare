  /api/v1/sync/:
    get:
      operationId: api_v1_sync_retrieve
      description: |-
        Pull records modified since last_synced_at.
        Query params: ?since=2025-01-01T00:00:00Z&entities=persons,pregnancy_episodes
        Returns: { "synced_at": "...", "records": { "persons": [...], ... } }
