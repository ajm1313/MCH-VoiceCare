openapi: 3.0.3
info:
  title: MCH VoiceCare API
  version: 1.0.0
  description: Maternal and Child Health VoiceCare platform API for Northern Ghana.
    Supports offline-first clinical capture, danger-sign rules, closed-loop referrals,
    FHIR R4 interoperability, OCR scanning, telephony (IVR/USSD), and server-side
    clinical ML.
  contact:
    name: MCH VoiceCare Team
    url: https://github.com/ajm1313/MCH-VoiceCare
  license:
    name: Proprietary
paths:
  /api/v1/accounts/auth/device-provision/:
    post:
      operationId: api_v1_accounts_auth_device_provision_create
      description: |-
        POST /api/v1/auth/device-provision/

        Registers a device for the authenticated user and returns
        bootstrap configuration for offline-first setup.
        Persists a Device record (spec §22.1).
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/auth/login/:
    post:
      operationId: api_v1_accounts_auth_login_create
      description: POST /api/v1/accounts/auth/login/
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/auth/logout/:
    post:
