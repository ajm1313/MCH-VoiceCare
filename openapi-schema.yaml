      - ''
    CWCSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        facility_name:
          type: string
          maxLength: 200
        session_date:
          type: string
          format: date
        session_type:
          $ref: '#/components/schemas/SessionTypeEnum'
