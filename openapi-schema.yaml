      - in: query
        name: referring_facility
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACCEPTED
          - ARRIVED
          - CANCELLED_BY_CLINICIAN
          - CLOSED
          - DECLINED
          - DISPOSITION_RECORDED
          - DRAFT
          - IN_TRANSIT
          - LOST_TO_FOLLOWUP
          - NO_ACK_ESCALATED
          - RECEIVING_FACILITY_NOTIFIED
          - REQUESTED
          - TRANSPORT_REQUESTED
          - TRANSPORT_UNAVAILABLE
        description: |-
          * `DRAFT` - Draft
          * `REQUESTED` - Requested
          * `RECEIVING_FACILITY_NOTIFIED` - Receiving Facility Notified
          * `ACCEPTED` - Accepted
          * `TRANSPORT_REQUESTED` - Transport Requested
          * `IN_TRANSIT` - In Transit
          * `ARRIVED` - Arrived
          * `DISPOSITION_RECORDED` - Disposition Recorded
          * `CLOSED` - Closed
          * `DECLINED` - Declined
          * `NO_ACK_ESCALATED` - No Ack — Escalated
          * `TRANSPORT_UNAVAILABLE` - Transport Unavailable
          * `CANCELLED_BY_CLINICIAN` - Cancelled by Clinician
          * `LOST_TO_FOLLOWUP` - Lost to Follow-up
      - in: query
        name: urgency
        schema:
          type: string
          enum:
          - ABSTAIN
          - EMERGENCY
          - PRIORITY
          - ROUTINE
        description: |-
          * `EMERGENCY` - Emergency
          * `PRIORITY` - Priority Review
          * `ROUTINE` - Routine
          * `ABSTAIN` - Abstain — Insufficient Data
