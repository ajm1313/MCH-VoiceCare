name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Backend — Python 3.12 + PostgreSQL 16
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mchvoicecare
          POSTGRES_PASSWORD: mchvoicecare_test
          POSTGRES_DB: mchvoicecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://mchvoicecare:mchvoicecare_test@localhost:5432/mchvoicecare_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SETTINGS_MODULE: config.settings.base

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run --source='.' manage.py test apps.tests --noinput

      - name: Generate coverage report
        run: coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ──────────────────────────────────────────────────────────────────────────
  # Mobile — Node 20 + JDK 17
  # ──────────────────────────────────────────────────────────────────────────
  mobile:
    name: Mobile Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx jest --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/

      - name: Build Android APK (debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  # ──────────────────────────────────────────────────────────────────────────
  # Deploy — only on push to main
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service web

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk-debug
          path: ./apk

      - name: Upload APK as release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mch-voicecare-apk-${{ github.sha }}
          path: ./apk/app-debug.apk
